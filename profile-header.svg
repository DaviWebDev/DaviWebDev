<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%">
  <defs>
    <style>
      /* Global Styling and Fonts */
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      
      /* Card Backgrounds */
      .card-bg {
        fill: #090e17;
        stroke: #1e293b;
        stroke-width: 1.5;
        rx: 16px;
      }
      .panel-bg {
        fill: #060910;
        stroke: #141c2e;
        stroke-width: 1;
        rx: 12px;
      }

      /* Subtle Grid Background pattern */
      .panel-grid {
        stroke: #101827;
        stroke-width: 0.5;
        stroke-dasharray: 4 4;
      }

      /* Glow Sweep Animation */
      .scanline-sweep {
        fill: url(#sweep-gradient);
        opacity: 0.08;
        mix-blend-mode: screen;
        animation: sweep-move 6s infinite linear;
        pointer-events: none;
      }
      @keyframes sweep-move {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(850px); }
      }

      /* Typography Styles */
      .text-dim { fill: #64748b; font-size: 11px; letter-spacing: 1.5px; }
      .text-title { fill: #f8fafc; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .text-cyan { fill: #2dd4bf; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; }
      .text-desc { fill: #94a3b8; font-size: 12px; }
      .text-tech { fill: #64748b; font-size: 11px; letter-spacing: 1px; }
      .text-node { font-size: 9px; font-weight: 600; letter-spacing: 1px; fill: #475569; }

      /* Online Status Indicator Animation */
      .status-dot {
        fill: #22c55e;
        animation: pulse-online 6s infinite ease-in-out;
      }
      .status-text-online {
        fill: #22c55e;
        font-weight: 600;
        text-anchor: end;
        animation: fade-online 6s infinite ease-in-out;
      }
      .status-text-coding {
        fill: #2dd4bf;
        font-weight: 600;
        text-anchor: end;
        opacity: 0;
        animation: fade-coding 6s infinite ease-in-out;
      }

      @keyframes pulse-online {
        0%, 75% { fill: #2dd4bf; opacity: 1; filter: drop-shadow(0 0 6px #2dd4bf); }
        80%, 95% { fill: #22c55e; opacity: 1; filter: drop-shadow(0 0 4px #22c55e); }
        100% { fill: #2dd4bf; opacity: 1; filter: drop-shadow(0 0 6px #2dd4bf); }
      }

      @keyframes fade-online {
        0%, 75% { opacity: 0; }
        80%, 100% { opacity: 1; }
      }

      @keyframes fade-coding {
        0%, 75% { opacity: 1; }
        80%, 100% { opacity: 0; }
      }

      /* Timeline Base and Progress Animation */
      .timeline-track {
        stroke: #1e293b;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .timeline-progress {
        stroke: #2dd4bf;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 560;
        stroke-dashoffset: 560;
        animation: progress-flow 6s infinite linear;
      }
      @keyframes progress-flow {
        0% { stroke-dashoffset: 560; stroke: #2dd4bf; }
        13.3% { stroke-dashoffset: 448; stroke: #2dd4bf; }
        26.6% { stroke-dashoffset: 336; stroke: #2dd4bf; }
        40.0% { stroke-dashoffset: 224; stroke: #2dd4bf; }
        53.3% { stroke-dashoffset: 112; stroke: #2dd4bf; }
        66.6% { stroke-dashoffset: 0; stroke: #2dd4bf; }
        75% { stroke-dashoffset: 0; stroke: #2dd4bf; }
        80% { stroke-dashoffset: 0; stroke: #22c55e; }
        95% { stroke-dashoffset: 0; stroke: #22c55e; }
        100% { stroke-dashoffset: 560; stroke: #2dd4bf; }
      }

      /* Timeline Nodes and Progressive Accumulation */
      .node {
        fill: #060910;
        stroke: #475569;
        stroke-width: 2;
        transform-box: fill-box;
        transform-origin: center;
      }
      .node-1 { animation: node-state-1 6s infinite linear; }
      .node-2 { animation: node-state-2 6s infinite linear; }
      .node-3 { animation: node-state-3 6s infinite linear; }
      .node-4 { animation: node-state-4 6s infinite linear; }
      .node-5 { animation: node-state-5 6s infinite linear; }
      .node-6 { animation: node-state-6 6s infinite linear; }

      @keyframes node-state-1 {
        0% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        66.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }
      @keyframes node-state-2 {
        0%, 13% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
        13.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        66.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }
      @keyframes node-state-3 {
        0%, 26% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
        26.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        66.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }
      @keyframes node-state-4 {
        0%, 39.5% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
        40% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        66.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }
      @keyframes node-state-5 {
        0%, 52.8% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
        53.3% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        66.5% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }
      @keyframes node-state-6 {
        0%, 66.1% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
        66.6% { stroke: #2dd4bf; fill: #042f2e; filter: drop-shadow(0 0 8px #2dd4bf); transform: scale(1.2); }
        80% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1.2); }
        95% { stroke: #22c55e; fill: #052e16; filter: drop-shadow(0 0 8px #22c55e); transform: scale(1); }
        98%, 100% { stroke: #475569; fill: #060910; filter: none; transform: scale(1); }
      }

      /* Node Labels Progressive State */
      .node-label-1 { animation: label-state-1 6s infinite linear; }
      .node-label-2 { animation: label-state-2 6s infinite linear; }
      .node-label-3 { animation: label-state-3 6s infinite linear; }
      .node-label-4 { animation: label-state-4 6s infinite linear; }
      .node-label-5 { animation: label-state-5 6s infinite linear; }
      .node-label-6 { animation: label-state-6 6s infinite linear; }

      @keyframes label-state-1 {
        0% { fill: #2dd4bf; }
        66.5% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }
      @keyframes label-state-2 {
        0%, 13% { fill: #475569; }
        13.5% { fill: #2dd4bf; }
        66.5% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }
      @keyframes label-state-3 {
        0%, 26% { fill: #475569; }
        26.5% { fill: #2dd4bf; }
        66.5% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }
      @keyframes label-state-4 {
        0%, 39.5% { fill: #475569; }
        40% { fill: #2dd4bf; }
        66.5% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }
      @keyframes label-state-5 {
        0%, 52.8% { fill: #475569; }
        53.3% { fill: #2dd4bf; }
        66.5% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }
      @keyframes label-state-6 {
        0%, 66.1% { fill: #475569; }
        66.6% { fill: #2dd4bf; }
        80% { fill: #22c55e; }
        95% { fill: #22c55e; }
        98%, 100% { fill: #475569; }
      }

      /* Footer Pulse Animation */
      .footer-pulse {
        animation: footer-glow 6s infinite ease-in-out;
      }
      @keyframes footer-glow {
        0%, 100% { fill: #64748b; filter: none; }
        50% { fill: #0d9488; filter: drop-shadow(0 0 6px #14b8a6); }
      }
    </style>

    <!-- Linear Gradient for Scanline Glow Sweep -->
    <linearGradient id="sweep-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern for Futuristic HUD effect -->
    <pattern id="hud-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0f172a" stroke-width="0.5"/>
    </pattern>

    <!-- Clip Path for Inner Panel -->
    <clipPath id="panel-clip">
      <rect x="44" y="54" width="672" height="208" rx="12" />
    </clipPath>

    <!-- Top Border Highlight Gradient -->
    <linearGradient id="top-border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="30%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Card Container -->
  <rect x="20" y="20" width="720" height="300" class="card-bg" />

  <!-- Subtle Top Accent Highlight Line -->
  <rect x="36" y="20" width="688" height="1.5" fill="url(#top-border-glow)" />

  <!-- Tiny HUD Corner Reticles -->
  <path d="M 28 32 L 28 28 L 32 28" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M 732 32 L 732 28 L 728 28" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M 28 308 L 28 312 L 32 312" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M 732 308 L 732 312 L 728 312" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Top Header Bar (Outside Inner Panel) -->
  <text x="48" y="46" class="text-dim">DAVIWEBDEV / PROFILE</text>
  <circle cx="662" cy="42" r="3.5" class="status-dot" />
  <text x="716" y="46" class="text-dim status-text-online">ONLINE</text>
  <text x="716" y="46" class="text-dim status-text-coding">CODING</text>

  <!-- Inner Panel Box & Contents Clipped -->
  <g clip-path="url(#panel-clip)">
    <rect x="44" y="54" width="672" height="208" class="panel-bg" />
    
    <!-- Subtle Grid Texture Inside Panel -->
    <rect x="44" y="54" width="672" height="208" fill="url(#hud-grid)" />

    <!-- Scanning Light Sweep Effect -->
    <rect x="44" y="54" width="120" height="208" class="scanline-sweep" />
  </g>

  <!-- Content inside Inner Panel -->
  <text x="72" y="92" class="text-title">Davi</text>
  <text x="72" y="116" class="text-cyan">DESENVOLVEDOR FRONT-END</text>
  <text x="72" y="136" class="text-desc">Construindo para a web · Desempenho · Segurança</text>

  <!-- Tech Stack & Counter -->
  <text x="72" y="172" class="text-tech">HTML · CSS · JS · TS · ASTRO</text>
  <text x="656" y="172" class="text-dim" style="text-anchor: end;">01 — 06</text>

  <!-- Timeline Section (Centered with slight right shift) -->
  <g transform="translate(84, 202)">
    <!-- Timeline Labels -->
    <text x="0" y="0" text-anchor="middle" class="text-node node-label-1">PLAN</text>
    <text x="108" y="0" text-anchor="middle" class="text-node node-label-2">CODE</text>
    <text x="216" y="0" text-anchor="middle" class="text-node node-label-3">REVIEW</text>
    <text x="324" y="0" text-anchor="middle" class="text-node node-label-4">TEST</text>
    <text x="432" y="0" text-anchor="middle" class="text-node node-label-5">BUILD</text>
    <text x="540" y="0" text-anchor="middle" class="text-node node-label-6">DEPLOY</text>

    <!-- Base Line -->
    <line x1="0" y1="16" x2="540" y2="16" class="timeline-track" />
    <!-- Animated Progress Line -->
    <line x1="0" y1="16" x2="540" y2="16" class="timeline-progress" />

    <!-- Timeline Nodes (6 circles spaced by 108px) -->
    <circle cx="0" cy="16" r="5" class="node node-1" />
    <circle cx="108" cy="16" r="5" class="node node-2" />
    <circle cx="216" cy="16" r="5" class="node node-3" />
    <circle cx="324" cy="16" r="5" class="node node-4" />
    <circle cx="432" cy="16" r="5" class="node node-5" />
    <circle cx="540" cy="16" r="5" class="node node-6" />
  </g>

  <!-- Bottom Footer Bar -->
  <text x="48" y="286" class="text-dim footer-pulse">SIGNAL / FLOW / BUILD</text>
  <text x="712" y="286" class="text-dim footer-pulse" style="text-anchor: end;">v.2026</text>
</svg>